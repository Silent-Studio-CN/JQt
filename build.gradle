// JQt — Gradle build for JitPack distribution (Java API jar only).
// Native libraries (jqt.dll / libjqt.so / libjqt.dylib) ship via GitHub Releases:
// https://github.com/Silent-Studio-CN/JQt/releases
plugins {
    id 'java-library'
    id 'maven-publish'
}

// JitPack injects -Pgroup/-Pversion (build per commit/tag); local default = Central Portal coordinate.
group = providers.gradleProperty('group').getOrElse('io.github.silent-xiaomiao')
version = providers.gradleProperty('version').getOrElse(new File("${rootDir}/VERSION").text.trim())

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    main {
        java {
            srcDirs = ['java']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Javadoc in Chinese is fine; JitPack hosts it automatically.
javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

// JitPack publishes via maven-publish (auto-detected); javadoc/sources included.
publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.group
            artifactId = 'jqt'
            version = project.version
            from components.java   // includes jar + sourcesJar + javadocJar
            pom {
                name = 'JQt'
                description = 'Qt for Java — native desktop UI via Qt 6 Widgets (Windows/Linux/macOS, x64+ARM64)'
                url = 'https://github.com/Silent-Studio-CN/JQt'
                licenses {
                    license {
                        name = 'JSL-1.0'
                        url = 'https://github.com/Silent-Studio-CN/JQt/blob/main/LICENSE.md'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'Silent-xiaomiao'
                        name = 'Silent-xiaomiao'
                        url = 'https://github.com/Silent-xiaomiao'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/Silent-Studio-CN/JQt.git'
                    developerConnection = 'scm:git:ssh://git@github.com:Silent-Studio-CN/JQt.git'
                    url = 'https://github.com/Silent-Studio-CN/JQt'
                }
            }
        }
    }
}