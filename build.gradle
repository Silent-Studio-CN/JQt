// JQt — Gradle build for JitPack distribution (Java API jar only).
// Native libraries (jqt.dll / libjqt.so / libjqt.dylib) ship via GitHub Releases:
// https://github.com/Silent-Studio-CN/JQt/releases
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.Silent-Studio-CN'
version = new File("${rootDir}/VERSION").text.trim()

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    main {
        java {
            srcDirs = ['java']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Javadoc in Chinese is fine; JitPack hosts it automatically.
javadoc {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

// JitPack publishes via maven-publish (auto-detected); javadoc/sources included.
publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.github.Silent-Studio-CN'
            artifactId = 'jqt'
            version = project.version
            from components.java
            artifact sourcesJar
            artifact javadocJar
        }
    }
}