name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # ================= Linux (Qt 6.12.0 + apt system deps) =================
  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Install system deps (Qt6 + g++)
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev g++ libqt6sql6-sqlite
          # QtMultimedia 依赖音频库:缺 libpulse 会导致 libjqt.so 整体加载失败
          # (UnsatisfiedLinkError: libpulse.so.0),不只是多媒体功能不可用
          sudo apt-get install -y libpulse0 || true
          sudo apt-get install -y libasound2t64 libasound2 || true

      - name: Install Qt 6.12.0 (manual 7z - aqt cannot parse new repo XML)
        run: |
          sudo apt-get install -y p7zip-full libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libegl1 libfontconfig1 libglib2.0-0 libdbus-1-3
          mkdir -p /tmp/qt7z/qt /tmp/qt7z/icu
          # Qt 6.12.0 uses the NEW repo layout: <module-dir>/<build-id><filename> (no slash)
          curl -fsSL -o /tmp/qtbase.7z "https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.linux_gcc_64/6.12.0-0-202609280346qtbase-Linux-RHEL_9_6-GCC-Linux-RHEL_9_6-X86_64.7z"
          curl -fsSL -o /tmp/icu.7z "https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.linux_gcc_64/6.12.0-0-202609280346icu-linux-Rhel8.6-x86_64.7z"
          7z x -y -o/tmp/qt7z/qt /tmp/qtbase.7z > /dev/null
          7z x -y -o/tmp/qt7z/icu /tmp/icu.7z > /dev/null
          # 新仓库的 7z 是扁平结构（直接 include/bin/lib，无 gcc_64 前缀）
          sudo mkdir -p /opt/6.12.0
          if [ -f /tmp/qt7z/qt/bin/qmake ]; then
            sudo mv /tmp/qt7z/qt /opt/6.12.0/gcc_64
          else
            GCC_DIR=$(find /tmp/qt7z/qt -type d -name gcc_64 | head -1)
            if [ -z "$GCC_DIR" ]; then echo "gcc_64 NOT FOUND in qt archive"; find /tmp/qt7z/qt -maxdepth 2 | head -20; exit 1; fi
            sudo mv "$GCC_DIR" /opt/6.12.0/gcc_64
          fi
          find /tmp/qt7z/icu -name "libicu*" -exec sudo cp {} /opt/6.12.0/gcc_64/lib/ \;
          rm -rf /tmp/qt7z /tmp/qtbase.7z /tmp/icu.7z
          test -f /opt/6.12.0/gcc_64/bin/qmake || (echo "qmake missing"; find /opt/6.12.0 -maxdepth 3 -type d | head -20; exit 1)

      - name: Install QtSvg 6.12.0 (qtsvg is a separate 7z inside the qtbase package dir)
        run: |
          # 取证:`qt.qt6.6120.linux_gcc_64/` 目录里 qtbase 与 qtsvg 是**两个独立 7z**
          # (7z l 清单:qtsvg 那个提供 lib/libQt6Svg.so、lib/libQt6Svg.so.6.12.0、
          #  lib/libQt6SvgWidgets.so.6.12.0、include/QtSvg/QSvgRenderer)。
          # 以前只解 qtbase -> libQt6Svg.so 根本不存在,所以 QSvgRenderer 在 Linux 上
          # 一直 SKIP —— 不是"没传 -DJQT_HAVE_SVG",是模块压根没装。
          curl -fsSL -o /tmp/qtsvg6120.7z "https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.linux_gcc_64/6.12.0-0-202609280346qtsvg-Linux-RHEL_9_6-GCC-Linux-RHEL_9_6-X86_64.7z"
          rm -rf /tmp/qtsvg6120 && mkdir -p /tmp/qtsvg6120
          7z x -y -o/tmp/qtsvg6120 /tmp/qtsvg6120.7z > /dev/null
          sudo cp -a /tmp/qtsvg6120/lib/. /opt/6.12.0/gcc_64/lib/
          if [ -d /tmp/qtsvg6120/include ]; then sudo cp -a /tmp/qtsvg6120/include/. /opt/6.12.0/gcc_64/include/; fi
          if [ -d /tmp/qtsvg6120/plugins ]; then sudo cp -a /tmp/qtsvg6120/plugins/. /opt/6.12.0/gcc_64/plugins/; fi
          rm -rf /tmp/qtsvg6120 /tmp/qtsvg6120.7z
          # 就地断言:宁可在这里断,也不要让 QSvgRenderer 又悄悄 SKIP。
          # 用 -s(跟随符号链接后必须非空)—— 万一 7z 没能建符号链接,这里会当场抓到。
          test -s /opt/6.12.0/gcc_64/lib/libQt6Svg.so || { echo "libQt6Svg.so 缺失或为空(符号链接没建出来?)"; ls -la /opt/6.12.0/gcc_64/lib/libQt6Svg* 2>&1; exit 1; }
          test -f /opt/6.12.0/gcc_64/include/QtSvg/QSvgRenderer || { echo "QtSvg 头文件缺失"; ls /opt/6.12.0/gcc_64/include | head -20; exit 1; }

      - name: Install Qt 6.8.3 (manual 7z - aqt cannot parse Linux XML)
        run: |
          mkdir -p /tmp/qt683/qt /tmp/qt683/icu
          curl -fsSL -o /tmp/qtbase683.7z "https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_683/qt6_683/qt.qt6.683.linux_gcc_64/6.8.3-0-202503201345qtbase-Linux-RHEL_8_10-GCC-Linux-RHEL_8_10-X86_64.7z"
          curl -fsSL -o /tmp/icu683.7z "https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_683/qt6_683/qt.qt6.683.linux_gcc_64/6.8.3-0-202503201345icu-linux-Rhel8.6-x86_64.7z"
          7z x -y -o/tmp/qt683/qt /tmp/qtbase683.7z > /dev/null
          7z x -y -o/tmp/qt683/icu /tmp/icu683.7z > /dev/null
          sudo mkdir -p /opt/Qt683/6.8.3
          if [ -f /tmp/qt683/qt/bin/qmake ]; then
            sudo mv /tmp/qt683/qt /opt/Qt683/6.8.3/gcc_64
          else
            GCC_DIR=$(find /tmp/qt683/qt -type d -name gcc_64 | head -1)
            if [ -z "$GCC_DIR" ]; then echo "gcc_64 NOT FOUND"; exit 1; fi
            sudo mv "$GCC_DIR" /opt/Qt683/6.8.3/gcc_64
          fi
          find /tmp/qt683/icu -name "libicu*" -exec sudo cp {} /opt/Qt683/6.8.3/gcc_64/lib/ \;
          rm -rf /tmp/qt683 /tmp/qtbase683.7z /tmp/icu683.7z
          test -f /opt/Qt683/6.8.3/gcc_64/bin/qmake || { echo "qmake missing"; exit 1; }

      - name: Install QtSvg 6.8.3 (qtsvg is a separate 7z inside the qtbase package dir)
        run: |
          # 同 6.12.0:6.8.3 的 qtsvg 也在 qt.qt6.683.linux_gcc_64/ 目录下单独一个 7z
          # (7z 清单实测:`6.8.3-0-202503201345qtsvg-Linux-RHEL_8_10-...7z` 提供
          #  lib/libQt6Svg.so -> libQt6Svg.so.6.8.3 与 include/QtSvg/QSvgRenderer)。
          curl -fsSL -o /tmp/qtsvg683.7z "https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_683/qt6_683/qt.qt6.683.linux_gcc_64/6.8.3-0-202503201345qtsvg-Linux-RHEL_8_10-GCC-Linux-RHEL_8_10-X86_64.7z"
          rm -rf /tmp/qtsvg683 && mkdir -p /tmp/qtsvg683
          7z x -y -o/tmp/qtsvg683 /tmp/qtsvg683.7z > /dev/null
          sudo cp -a /tmp/qtsvg683/lib/. /opt/Qt683/6.8.3/gcc_64/lib/
          if [ -d /tmp/qtsvg683/include ]; then sudo cp -a /tmp/qtsvg683/include/. /opt/Qt683/6.8.3/gcc_64/include/; fi
          if [ -d /tmp/qtsvg683/plugins ]; then sudo cp -a /tmp/qtsvg683/plugins/. /opt/Qt683/6.8.3/gcc_64/plugins/; fi
          rm -rf /tmp/qtsvg683 /tmp/qtsvg683.7z
          test -s /opt/Qt683/6.8.3/gcc_64/lib/libQt6Svg.so || { echo "libQt6Svg.so 缺失或为空(符号链接没建出来?)"; ls -la /opt/Qt683/6.8.3/gcc_64/lib/libQt6Svg* 2>&1; exit 1; }
          test -f /opt/Qt683/6.8.3/gcc_64/include/QtSvg/QSvgRenderer || { echo "QtSvg 头文件缺失"; ls /opt/Qt683/6.8.3/gcc_64/include | head -20; exit 1; }

      - name: Install QtTools (QtHelp) 6.12.0 - base package
        run: |
          curl -fsSL -o /tmp/qttools.7z "https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.linux_gcc_64/6.12.0-0-202609280346qttools-Linux-RHEL_9_6-GCC-Linux-RHEL_9_6-X86_64.7z"
          7z x -y -o/tmp/qttools /tmp/qttools.7z > /dev/null
          sudo cp -a /tmp/qttools/lib/. /opt/6.12.0/gcc_64/lib/
          [ -d /tmp/qttools/include ] && sudo cp -a /tmp/qttools/include/. /opt/6.12.0/gcc_64/include/
          [ -d /tmp/qttools/bin ] && sudo cp -a /tmp/qttools/bin/. /opt/6.12.0/gcc_64/bin/
          ls /opt/6.12.0/gcc_64/lib | grep -qi help || (echo "libQt6Help missing"; exit 1)
          ls /opt/6.12.0/gcc_64/bin | grep -qi qhelpgenerator \
            && echo "qhelpgenerator: /opt/6.12.0/gcc_64/bin/qhelpgenerator" \
            || echo "::warning::qhelpgenerator 未随 qttools 装入 /opt/6.12.0/gcc_64/bin"

      - name: Install QtPositioning 6.12.0 (prebuilt addon)
        run: |
          curl -fsSL -o /tmp/qtpositioning.7z "https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.addons.qtpositioning.linux_gcc_64/6.12.0-0-202609280346qtpositioning-Linux-RHEL_9_6-GCC-Linux-RHEL_9_6-X86_64.7z"
          7z x -y -o/tmp/qtpositioning /tmp/qtpositioning.7z > /dev/null
          sudo cp -a /tmp/qtpositioning/lib/. /opt/6.12.0/gcc_64/lib/
          [ -d /tmp/qtpositioning/include ] && sudo cp -a /tmp/qtpositioning/include/. /opt/6.12.0/gcc_64/include/
          ls /opt/6.12.0/gcc_64/lib | grep -qi positioning || (echo "libQt6Positioning missing"; exit 1)

      - name: Install QtDeclarative (QtQuick) 6.12.0 - base package
        run: |
          curl -fsSL -o /tmp/qtdeclarative.7z "https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.linux_gcc_64/6.12.0-0-202609280346qtdeclarative-Linux-RHEL_9_6-GCC-Linux-RHEL_9_6-X86_64.7z"
          7z x -y -o/tmp/qtdeclarative /tmp/qtdeclarative.7z > /dev/null
          sudo cp -a /tmp/qtdeclarative/lib/. /opt/6.12.0/gcc_64/lib/
          [ -d /tmp/qtdeclarative/include ] && sudo cp -a /tmp/qtdeclarative/include/. /opt/6.12.0/gcc_64/include/
          [ -d /tmp/qtdeclarative/qml ] && sudo cp -a /tmp/qtdeclarative/qml /opt/6.12.0/gcc_64/
          ls /opt/6.12.0/gcc_64/lib | grep -qi quick || (echo "libQt6Quick missing"; exit 1)

      - name: Install QtQuick3D + Qt Shader Tools 6.12.0 (prebuilt addons)
        run: |
          # Quick 3D(v1.9.3)是 QML 模块(import QtQuick3D),但它的插件链要两个独立 addon:
          #   qquick3dplugin -> libQt6Quick3D.so -> libQt6Quick3DRuntimeRender.so -> **libQt6ShaderTools.so**
          # 少了 qtshadertools 就是 "Cannot load library .../qquick3dplugin.so"(与 Windows 同一个坑)。
          # qtquick3d 自带 qml/QtQuick3D(QML 模块)与 libQt6Quick3D*.so;qtshadertools 提供
          # libQt6ShaderTools.so——它**属于 qt.qt6.6120.addons.\* 目录**,不在 qtbase 里。
          curl -fsSL -o /tmp/qtquick3d.7z "https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.addons.qtquick3d.linux_gcc_64/6.12.0-0-202609280346qtquick3d-Linux-RHEL_9_6-GCC-Linux-RHEL_9_6-X86_64.7z"
          curl -fsSL -o /tmp/qtshadertools.7z "https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.addons.qtshadertools.linux_gcc_64/6.12.0-0-202609280346qtshadertools-Linux-RHEL_9_6-GCC-Linux-RHEL_9_6-X86_64.7z"
          7z x -y -o/tmp/qtquick3d /tmp/qtquick3d.7z > /dev/null
          7z x -y -o/tmp/qtshadertools /tmp/qtshadertools.7z > /dev/null
          sudo cp -a /tmp/qtquick3d/lib/. /opt/6.12.0/gcc_64/lib/
          [ -d /tmp/qtquick3d/include ] && sudo cp -a /tmp/qtquick3d/include/. /opt/6.12.0/gcc_64/include/
          # QML 模块必须按 7z 里的目录结构放进 <Qt前缀>/qml —— 否则运行期报
          # "module \"QtQuick3D\" is not installed"(Qt 6 的可重定位前缀就是这里)
          sudo mkdir -p /opt/6.12.0/gcc_64/qml
          [ -d /tmp/qtquick3d/qml ] && sudo cp -a /tmp/qtquick3d/qml/. /opt/6.12.0/gcc_64/qml/
          [ -d /tmp/qtquick3d/plugins ] && sudo cp -a /tmp/qtquick3d/plugins/. /opt/6.12.0/gcc_64/plugins/
          sudo cp -a /tmp/qtshadertools/lib/. /opt/6.12.0/gcc_64/lib/
          [ -d /tmp/qtshadertools/include ] && sudo cp -a /tmp/qtshadertools/include/. /opt/6.12.0/gcc_64/include/
          ls /opt/6.12.0/gcc_64/lib | grep -qi shadertools || (echo "libQt6ShaderTools missing"; ls /tmp/qtshadertools/lib | head; exit 1)
          # 两条硬前置:少了任何一个,Quick3D 只会"绿着 SKIP",所以这里必须红
          ls /opt/6.12.0/gcc_64/lib | grep -qi quick3d || (echo "libQt6Quick3D missing"; ls /tmp/qtquick3d/lib | head; exit 1)
          test -f /opt/6.12.0/gcc_64/qml/QtQuick3D/qmldir || { echo "qml/QtQuick3D/qmldir 没装进去"; find /tmp/qtquick3d -maxdepth 3 -type d | head -20; exit 1; }
          echo "QtQuick3D + QtShaderTools 安装完成:$(ls /opt/6.12.0/gcc_64/lib | grep -ci quick3d) 个 Quick3D 库"

      - name: Install QtMultimedia 6.12.0 (prebuilt addon)
        run: |
          curl -fsSL -o /tmp/qtmultimedia.7z "https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.addons.qtmultimedia.linux_gcc_64/6.12.0-0-202609280346qtmultimedia-Linux-RHEL_9_6-GCC-Linux-RHEL_9_6-X86_64.7z"
          7z x -y -o/tmp/qtmultimedia /tmp/qtmultimedia.7z > /dev/null
          sudo cp -a /tmp/qtmultimedia/lib/. /opt/6.12.0/gcc_64/lib/
          [ -d /tmp/qtmultimedia/include ] && sudo cp -a /tmp/qtmultimedia/include/. /opt/6.12.0/gcc_64/include/
          [ -d /tmp/qtmultimedia/plugins ] && sudo cp -a /tmp/qtmultimedia/plugins/. /opt/6.12.0/gcc_64/plugins/
          ls /opt/6.12.0/gcc_64/lib | grep -qi multimedia || (echo "libQt6Multimedia missing"; exit 1)

      - name: Install QtCharts 6.12.0 (prebuilt addon)
        run: |
          curl -fsSL -o /tmp/qtcharts.7z "https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.addons.qtcharts.linux_gcc_64/6.12.0-0-202609280346qtcharts-Linux-RHEL_9_6-GCC-Linux-RHEL_9_6-X86_64.7z"
          7z x -y -o/tmp/qtcharts /tmp/qtcharts.7z > /dev/null
          sudo cp -a /tmp/qtcharts/lib/. /opt/6.12.0/gcc_64/lib/
          [ -d /tmp/qtcharts/include ] && sudo cp -a /tmp/qtcharts/include/. /opt/6.12.0/gcc_64/include/
          ls /opt/6.12.0/gcc_64/lib | grep -qi charts || (echo "libQt6Charts missing"; exit 1)

      - name: Install QtWebSockets 6.12.0 (prebuilt addon)
        run: |
          curl -fsSL -o /tmp/qtwebsockets.7z "https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.addons.qtwebsockets.linux_gcc_64/6.12.0-0-202609280346qtwebsockets-Linux-RHEL_9_6-GCC-Linux-RHEL_9_6-X86_64.7z"
          7z x -y -o/tmp/qtwebsockets /tmp/qtwebsockets.7z > /dev/null
          sudo cp -a /tmp/qtwebsockets/lib/. /opt/6.12.0/gcc_64/lib/
          [ -d /tmp/qtwebsockets/include ] && sudo cp -a /tmp/qtwebsockets/include/. /opt/6.12.0/gcc_64/include/
          ls /opt/6.12.0/gcc_64/lib | grep -qi websockets || (echo "libQt6WebSockets missing"; exit 1)

      - name: Build qtserialport 6.12.0 (source)
        run: |
          # 用 archive 路径（长期保留）；official_releases 会被 Qt 下架，会导致 404 → unzip 失败
          curl -fsSL -A "Mozilla/5.0" -o /tmp/qtserialport.zip "https://download.qt.io/archive/qt/6.12/6.12.0/submodules/qtserialport-everywhere-src-6.12.0.zip"
          cd /tmp && unzip -q qtserialport.zip && cd qtserialport-everywhere-src-6.12.0
          cmake -S . -B build -DCMAKE_PREFIX_PATH=/opt/6.12.0/gcc_64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build build -j$(nproc)
          sudo cmake --install build

      - name: Build qtserialport 6.8.3 (source)
        run: |
          # v1.8.0 后修复：official_releases/qt/6.8/6.8.3 的源码 zip 已下架（404），改用 archive 路径
          curl -fsSL -A "Mozilla/5.0" -o /tmp/qtserialport683.zip "https://download.qt.io/archive/qt/6.8/6.8.3/submodules/qtserialport-everywhere-src-6.8.3.zip"
          cd /tmp && unzip -q qtserialport683.zip && cd qtserialport-everywhere-src-6.8.3
          cmake -S . -B build -DCMAKE_PREFIX_PATH=/opt/Qt683/6.8.3/gcc_64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build build -j$(nproc)
          sudo cmake --install build

      - name: Build libjqt.so (Qt 6.8.3)
        run: |
          chmod +x build-linux.sh
          QT_BASE=/opt/Qt683/6.8.3/gcc_64 ./build-linux.sh
          mv lib/libjqt.so lib/libjqt-6.8.3.so

      - name: Build libjqt.so (Qt 6.12.0)
        run: |
          QT_BASE=/opt/6.12.0/gcc_64 ./build-linux.sh
          mv lib/libjqt.so lib/libjqt-6.12.0.so

      - name: Smoke test (Qt 6.12.0, offscreen)
        timeout-minutes: 4
        run: |
          chmod +x run-linux.sh
          cp lib/libjqt-6.12.0.so lib/libjqt.so
          export QT_BASE=/opt/6.12.0/gcc_64
          export QT_PLUGIN_PATH=/opt/6.12.0/gcc_64/plugins
          set +e
          QT_QPA_PLATFORM=offscreen timeout 90 ./run-linux.sh -AutoClose 2000 > smoke_out.txt 2>&1
          CODE=$?
          echo "smoke exit code: $CODE"
          cat smoke_out.txt
          if [ $CODE -ne 0 ]; then
            echo "=== DIAG ==="
            ls -la "$PWD/lib"
            ldd "$PWD/lib/libjqt.so" 2>&1 | head -20
            find /opt/Qt -name "*qoffscreen*" 2>/dev/null
            JPID=$(pgrep -f "org.jqt.JQtDemo" | head -1)
            if [ -n "$JPID" ]; then
              jcmd "$JPID" Thread.print 2>&1 | head -80
              kill -9 "$JPID"
            fi
            exit $CODE
          fi
          # Exclusive Kit 跨平台 API 冒烟（v0.7.0）
          QT_QPA_PLATFORM=offscreen timeout 90 ./run-linux.sh -Class org.jqt.SmokeExclusive -AutoClose 1000 > smoke_exclusive.txt 2>&1
          CODE2=$?
          echo "smoke exclusive exit code: $CODE2"
          cat smoke_exclusive.txt
          if [ $CODE2 -ne 0 ]; then exit $CODE2; fi
          # L1 收尾冒烟（v0.7.1）
          for SMOKE in org.jqt.SmokeL1 org.jqt.SmokeL1b2; do
            QT_QPA_PLATFORM=offscreen timeout 90 ./run-linux.sh -Class $SMOKE -AutoClose 1000 > smoke_l1.txt 2>&1
            CODE3=$?
            echo "smoke $SMOKE exit code: $CODE3"
            cat smoke_l1.txt
            if [ $CODE3 -ne 0 ]; then exit $CODE3; fi
          done
          # 工业模块冒烟（v0.7.2：PDF + SQLite）
          QT_QPA_PLATFORM=offscreen timeout 90 ./run-linux.sh -Class org.jqt.SmokeV072 -AutoClose 1000 > smoke_v072.txt 2>&1
          CODE4=$?
          echo "smoke v0.7.2 exit code: $CODE4"
          cat smoke_v072.txt
          if [ $CODE4 -ne 0 ]; then
            echo "=== HS_ERR (native frames) ==="
            cat hs_err_pid*.log 2>/dev/null | head -120
            exit $CODE4
          fi
          # QOpenGLWidget 冒烟（v0.7.3，offscreen 容错）
          QT_QPA_PLATFORM=offscreen timeout 90 ./run-linux.sh -Class org.jqt.SmokeV073 -AutoClose 1000 > smoke_v073.txt 2>&1
          CODE5=$?
          echo "smoke v0.7.3 exit code: $CODE5"
          cat smoke_v073.txt
          if [ $CODE5 -ne 0 ]; then exit $CODE5; fi
          # QSerialPort 冒烟（v0.7.4）
          QT_QPA_PLATFORM=offscreen timeout 90 ./run-linux.sh -Class org.jqt.SmokeV074 -AutoClose 1000 > smoke_v074.txt 2>&1
          CODE6=$?
          echo "smoke v0.7.4 exit code: $CODE6"
          cat smoke_v074.txt
          if [ $CODE6 -ne 0 ]; then exit $CODE6; fi
          # 信号投递确定性回归（v1.9.1：重复投递 / global ref 泄漏）
          QT_QPA_PLATFORM=offscreen timeout 90 ./run-linux.sh -Class org.jqt.SmokeSignalOnce -AutoClose 800 > smoke_sig.txt 2>&1
          CODE7=$?
          echo "smoke signal-once exit code: $CODE7"
          cat smoke_sig.txt
          if [ $CODE7 -ne 0 ]; then exit $CODE7; fi
          # QTimer + 跨线程编组（v1.9.1 P0-①）
          QT_QPA_PLATFORM=offscreen timeout 90 ./run-linux.sh -Class org.jqt.SmokeTimer -AutoClose 1500 > smoke_timer.txt 2>&1
          CODE8=$?
          echo "smoke timer exit code: $CODE8"
          cat smoke_timer.txt
          if [ $CODE8 -ne 0 ]; then exit $CODE8; fi
          # 新增冒烟:v1.9.1(P0 并发 / 回调异常 / QStackedWidget)
          export QT_QUICK_BACKEND=software       # QtQuick 场景图软件后端
          # 只在本 Qt 的工具确实存在时才导出 —— 避免冒烟误用发行版包装脚本
          if [ -x /opt/6.12.0/gcc_64/bin/qhelpgenerator ]; then
            export JQT_QHELP_GENERATOR=/opt/6.12.0/gcc_64/bin/qhelpgenerator
          else
            echo "::warning::未找到本 Qt 的 qhelpgenerator,Help 冒烟将跳过 .qch 生成段"
          fi
          for C in org.jqt.SmokeConcurrency org.jqt.SmokeCallbackError org.jqt.SmokeStacked org.jqt.SmokeEvent org.jqt.SmokeNetwork org.jqt.SmokeSqlModel org.jqt.SmokeWebSocket org.jqt.SmokeJQtTest org.jqt.SmokeStateMachine org.jqt.SmokeDBus org.jqt.SmokeWebView org.jqt.SmokeCharts org.jqt.SmokeMultimedia org.jqt.SmokeModality org.jqt.SmokeQml org.jqt.SmokePositioning org.jqt.SmokeHelp org.jqt.SmokeFluent org.jqt.SmokeInputDialog org.jqt.SmokeVisible org.jqt.SmokeL2 org.jqt.SmokeL1fin; do
            QT_QPA_PLATFORM=offscreen timeout 90 ./run-linux.sh -Class $C -AutoClose 1200 > "smoke_$C.txt" 2>&1
            RC=$?
            echo "smoke $C exit code: $RC"; cat "smoke_$C.txt"
            if [ $RC -ne 0 ]; then exit $RC; fi
          done
          # 硬断言(v1.9.2):QSvg 与 SQLite 在 Linux 上不许再 SKIP。
          # 两段式断言(反向禁 SKIP + 正向要求看到实测断言行),详见 tools/smoke-assert-no-skip.sh;
          # 这样"以后又退化回 SKIP"会直接让 CI 红,而不是继续绿着跳。
          # 注意本 step 前面执行过 set +e,所以这里显式判断退出码。
          if ! bash tools/smoke-assert-no-skip.sh Linux \
                 "smoke_org.jqt.SmokeEvent.txt" "smoke_org.jqt.SmokeSqlModel.txt"; then
            exit 1
          fi


      - name: Doc numbers match code (防假账闸门)
        run: |
          # 文档里写的能力点数/命中率/类数/行数/桥行数/JNI 数,一律与代码实测比对;
          # 不一致直接红 —— 人不记得没关系,脚本记得。
          python3 tools/check-doc-numbers.py

      - name: Smoke DBus with a real session bus (v1.9.2 P1 收尾)
        timeout-minutes: 4
        run: |
          # 上面那轮 DBus 冒烟跑在"无会话总线"环境:验证的是错误路径与消息语义。
          # 这一步用 dbus-run-session 起一个**真实总线**,把端到端调用(ListNames /
          # NameHasOwner / GetId / 发信号)真跑一遍 —— 否则"DBus 能用了"就是空话。
          # 注意:**每个 step 的环境不共享**,Qt 路径必须在这里重新导出,
          # 否则 dbus-run-session 里会 UnsatisfiedLinkError(实测踩过:缺 libQt6SerialPort)。
          chmod +x run-linux.sh
          cp lib/libjqt-6.12.0.so lib/libjqt.so
          export QT_BASE=/opt/6.12.0/gcc_64
          export QT_PLUGIN_PATH=/opt/6.12.0/gcc_64/plugins
          command -v dbus-run-session >/dev/null 2>&1 || sudo apt-get install -y dbus
          set -o pipefail
          QT_QPA_PLATFORM=offscreen dbus-run-session -- timeout 90 ./run-linux.sh \
              -Class org.jqt.SmokeDBus -AutoClose 1200 2>&1 | tee smoke_dbus_session.txt
          grep -q "ALL PASS" smoke_dbus_session.txt || { echo "::error::DBus 冒烟未通过"; exit 1; }
          # 关键:有真实总线时**不允许**再出现"端到端被跳过" —— 出现了就说明这一步是假的
          if grep -q "SKIP 端到端调用" smoke_dbus_session.txt; then
            echo "::error::有 dbus-run-session 却仍跳过端到端调用,DBus 并未真正验证"
            exit 1
          fi
          grep -q "NameHasOwner(org.freedesktop.DBus) = true" smoke_dbus_session.txt \
            || { echo "::error::参数编组的端到端断言未见通过"; exit 1; }
          grep -q "列表里有 org.freedesktop.DBus" smoke_dbus_session.txt \
            || { echo "::error::字符串数组(QStringList)读取断言未见通过"; exit 1; }
          echo "DBus 端到端验证通过(真实会话总线)"

      - name: Real-window smoke under Xvfb (J9 - offscreen 抓不到真窗口崩溃)
        run: |
          sudo apt-get install -y xvfb
          cp lib/libjqt-6.12.0.so lib/libjqt.so
          export QT_BASE=/opt/6.12.0/gcc_64
          export QT_PLUGIN_PATH=/opt/6.12.0/gcc_64/plugins
          # 用真实平台插件(xcb)创建/显示/移动/缩放窗口 —— J1 那类问题只有这里能抓
          xvfb-run -a env QT_QPA_PLATFORM=xcb timeout 120 ./run-linux.sh -Class org.jqt.SmokeRealWindow -AutoClose 900

      - name: Quick 3D smoke under Xvfb (xcb + OpenGL, v1.9.3)
        run: |
          # Quick 3D 必须有 RHI:offscreen 平台插件没有 GL/RHI 表面,Qt Quick 退到软件后端,
          # View3D 画不出来(Windows 实测;Linux 同理)。所以这里用 Xvfb + 真平台插件(xcb),
          # 让 Qt Quick 走 OpenGL RHI(Mesa llvmpipe 软件光栅),把 3D 内容检查真跑一遍。
          # **暂不加** JQT_Q3D_STRICT=1:llvmpipe 是否满足 Quick 3D 的 GL 要求还没在 CI 里验过,
          # 先让它如实 SKIP/通过并留下日志(渲染成功会打印立方体/清屏色点数),下次再决定收紧。
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
          chmod +x run-linux.sh
          cp lib/libjqt-6.12.0.so lib/libjqt.so
          export QT_BASE=/opt/6.12.0/gcc_64
          export QT_PLUGIN_PATH=/opt/6.12.0/gcc_64/plugins
          # 先把 GL 栈的实际能力记进日志 —— 判断"能不能渲染出 3D"就靠这行(llvmpipe 的 GL 版本)
          # 显式给 Xvfb 24 位色深:默认值在部分版本里是 640x480x8,8 位屏拿不到可用的 GLX visual,
          # Qt 会退回软件渲染 -> Quick3D 直接没画面(离屏"渲染不出来"最常见的成因之一)。
          xvfb-run -a -s "-screen 0 1280x1024x24" glxinfo -B 2>&1 | grep -Ei "OpenGL (version|renderer)|direct rendering" || echo "::warning::glxinfo 拿不到 GL 信息(mesa-utils 缺失?)"
          set +e
          # 显式指定 OpenGL RHI:这台 runner 上没有 Vulkan 驱动,写明后端省得靠"Qt 当时的默认值";
          # JQT_Q3D_WAIT_MS=2100 给慢机器 3 倍抓图窗口(同 Windows 那步的理由:llvmpipe 上首帧更慢),
          # 同样**不放宽**任何断言(-AutoClose 只是兜底,冒烟自己 scheduleQuit)。
          xvfb-run -a -s "-screen 0 1280x1024x24" env QT_QPA_PLATFORM=xcb QSG_RHI_BACKEND=opengl JQT_Q3D_WAIT_MS=2100 timeout 120 ./run-linux.sh -Class org.jqt.SmokeQuick3D -AutoClose 6000 > smoke_quick3d_xvfb.txt 2>&1
          CODE=$?
          echo "Quick3D 冒烟(xcb/Xvfb) exit code: $CODE"
          cat smoke_quick3d_xvfb.txt
          if [ $CODE -ne 0 ]; then
            echo "::error::Quick3D 冒烟在 Xvfb 下失败(exit $CODE)"
            exit $CODE
          fi
          # 正向证据:必须看到冒烟自己的结论行,否则"文件为空/没跑完"会被当成通过
          if ! grep -q "\[q3d\] pass=" smoke_quick3d_xvfb.txt; then
            echo "::error::没有 [q3d] pass= 结论行(冒烟没跑到结束?)"
            exit 1
          fi
          if grep -q "立方体类暖色 #f59e0b : 0 点" smoke_quick3d_xvfb.txt; then
            echo "::warning::Xvfb+llvmpipe 下没渲染出立方体(冒烟如实 SKIP,未计入 pass)—— 收紧断言前先看这条与上面的 GL 版本"
          else
            echo "Quick3D 在 Xvfb(xcb + OpenGL/llvmpipe)下真渲染出内容 ✅"
            grep -E "图像尺寸|像素抽样|立方体类暖色|清屏类深蓝" smoke_quick3d_xvfb.txt || true
          fi

      - name: Bundle Qt runtime (Linux) + validate bundled launcher
        run: |
          chmod +x tools/bundle-qt.sh
          QT_BASE=/opt/6.12.0/gcc_64 ./tools/bundle-qt.sh
          # 解包 -> 放入我们的 classes -> 用包内启动器离屏冒烟(证明自带 Qt 真能用)
          TMP="$(mktemp -d)"
          tar -xzf dist/*-qt-runtime.tar.gz -C "$TMP"
          PKG="$(ls -d "$TMP"/*/ | head -1)"
          cp -R out "$PKG/"
          ( cd "$PKG" && QT_QPA_PLATFORM=offscreen timeout 90 ./run-with-bundled-qt.sh org.jqt.SmokeL1 )
          ( cd "$PKG" && QT_QPA_PLATFORM=offscreen timeout 90 ./run-with-bundled-qt.sh org.jqt.SmokeSignalOnce )

      - name: Upload Qt runtime bundle (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: jqt-linux-qt-runtime
          path: dist/*-qt-runtime.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjqt-linux-x64
          path: lib/libjqt-*.so
  # ================= Windows (install-qt-action Qt + MinGW) =================
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Configure aqt (skip checksum verification)
        shell: pwsh
        run: |
          Set-Content -Path "D:/aqt.ini" -Value "[mirrors]" -Encoding ascii
          Add-Content -Path "D:/aqt.ini" -Value "trusted_mirrors = https://download.qt.io"

      - name: Install Qt 6.8.3 + MinGW 13.1
        shell: pwsh
        run: |
          pip install aqtinstall
          Write-Host "=== Updates.xml probe ==="
          curl.exe -s -o NUL -w 'HTTP %{http_code}\n' "https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6120/qt6_6120/Updates.xml"
          Write-Host "=== install-qt (with config) ==="
          python -m aqt -c D:/aqt.ini install-qt windows desktop 6.8.3 win64_mingw --outputdir C:/Qt --archives qtbase -m qtserialport *> aqt_qt.log
          Write-Host "install-qt exit=$LASTEXITCODE"
          Get-Content aqt_qt.log -Tail 12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m aqt -c D:/aqt.ini install-tool windows desktop tools_mingw1310 --outputdir C:/Qt
          if (-not (Test-Path "C:/Qt/6.8.3/mingw_64/bin/qmake.exe")) { throw "qmake.exe missing after aqt install" }

      - name: Build jqt.dll
        shell: pwsh
        run: |
          $gpp = Get-ChildItem "C:/Qt/Tools" -Recurse -Depth 3 -Filter "g++.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $mingw = if ($gpp) { Split-Path (Split-Path $gpp.FullName) } else { "C:/Qt/Tools/mingw1310_64" }
          Write-Host "MINGW=$mingw"
          powershell -File build.ps1 -JDK "$env:JAVA_HOME" -QtRoot "C:/Qt/6.8.3" -Mingw $mingw *> build_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== BUILD FAILED, tail of build_log.txt ==="
            Get-Content build_log.txt -Tail 60
            exit $LASTEXITCODE
          }

      - name: Smoke test (offscreen, headless)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_PLUGIN_PATH = "C:/Qt/6.8.3/mingw_64/plugins"
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -AutoClose 2000 *> smoke_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE FAILED, tail of smoke_log.txt ==="
            Get-Content smoke_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          # Exclusive Kit 跨平台 API 冒烟（v0.7.0）
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeExclusive -AutoClose 1000 *> smoke_exclusive_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE EXCLUSIVE FAILED, tail of smoke_exclusive_log.txt ==="
            Get-Content smoke_exclusive_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          # L1 收尾冒烟（v0.7.1）
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeL1 -AutoClose 1000 *> smoke_l1_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE L1 FAILED, tail of smoke_l1_log.txt ==="
            Get-Content smoke_l1_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeL1b2 -AutoClose 1000 *> smoke_l1b2_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE L1B2 FAILED, tail of smoke_l1b2_log.txt ==="
            Get-Content smoke_l1b2_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          # 工业模块冒烟（v0.7.2：PDF + SQLite）
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeV072 -AutoClose 1000 *> smoke_v072_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE V072 FAILED, tail of smoke_v072_log.txt ==="
            Get-Content smoke_v072_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          # QOpenGLWidget 冒烟（v0.7.3，offscreen 容错）
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeV073 -AutoClose 1000 *> smoke_v073_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE V073 FAILED, tail of smoke_v073_log.txt ==="
            Get-Content smoke_v073_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          # QSerialPort 冒烟（v0.7.4）
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeV074 -AutoClose 1000 *> smoke_v074_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE V074 FAILED, tail of smoke_v074_log.txt ==="
            Get-Content smoke_v074_log.txt -Tail 40
            exit $LASTEXITCODE
          }
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            build_log.txt
            smoke_log.txt

      - name: Install Qt 6.12.0 (manual 7z - aqt cannot parse new repo XML)
        shell: pwsh
        run: |
          # download.qt.io 会按地域 302 到各镜像, 而镜像同步有先后 -> 逐个镜像回退
          $rel = "qt6_6120/qt6_6120_mingw"
          $bases = @(
            "https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/$rel",
            "https://mirrors.tuna.tsinghua.edu.cn/qt/online/qtsdkrepository/windows_x86/desktop/$rel",
            "https://mirrors.ustc.edu.cn/qtproject/online/qtsdkrepository/windows_x86/desktop/$rel",
            "https://mirror.nju.edu.cn/qt/online/qtsdkrepository/windows_x86/desktop/$rel"
          )
          $items = @{
            "qtbase.7z"      = "qt.qt6.6120.win64_mingw/6.12.0-0-202609280346qtbase-Windows-Windows_11_24H2-Mingw-Windows-Windows_11_24H2-X86_64.7z"
            "d3dcompiler.7z" = "qt.qt6.6120.win64_mingw/6.12.0-0-202609280346d3dcompiler_47-x64.7z"
            "opengl32sw.7z"  = "qt.qt6.6120.win64_mingw/6.12.0-0-202609280346opengl32sw-64-mesa_11_2_2-signed_sha256.7z"
            "serialport.7z"  = "qt.qt6.6120.addons.qtserialport.win64_mingw/6.12.0-0-202609280346qtserialport-Windows-Windows_11_24H2-Mingw-Windows-Windows_11_24H2-X86_64.7z"
            "websockets.7z"  = "qt.qt6.6120.addons.qtwebsockets.win64_mingw/6.12.0-0-202609280346qtwebsockets-Windows-Windows_11_24H2-Mingw-Windows-Windows_11_24H2-X86_64.7z"
            "charts.7z"      = "qt.qt6.6120.addons.qtcharts.win64_mingw/6.12.0-0-202609280346qtcharts-Windows-Windows_11_24H2-Mingw-Windows-Windows_11_24H2-X86_64.7z"
            "multimedia.7z"  = "qt.qt6.6120.addons.qtmultimedia.win64_mingw/6.12.0-0-202609280346qtmultimedia-Windows-Windows_11_24H2-Mingw-Windows-Windows_11_24H2-X86_64.7z"
            "declarative.7z" = "qt.qt6.6120.win64_mingw/6.12.0-0-202609280346qtdeclarative-Windows-Windows_11_24H2-Mingw-Windows-Windows_11_24H2-X86_64.7z"
            "positioning.7z" = "qt.qt6.6120.addons.qtpositioning.win64_mingw/6.12.0-0-202609280346qtpositioning-Windows-Windows_11_24H2-Mingw-Windows-Windows_11_24H2-X86_64.7z"
            # Qt Quick 3D(v1.9.3):qtquick3d 是独立 addon(提供 bin/Qt6Quick3D*.dll 与 qml/QtQuick3D);
            # 而它的插件链 qquick3dplugin -> Qt6Quick3D -> Qt6Quick3DRuntimeRender **-> Qt6ShaderTools**
            # 还要 qtshadertools 这个 addon —— 官方 MinGW 在线安装器默认不装它,少一个就是
            # "Cannot load library .../qquick3dplugin.dll: 找不到指定的模块"(本机 6.12.0 实测的根因)。
            "quick3d.7z"     = "qt.qt6.6120.addons.qtquick3d.win64_mingw/6.12.0-0-202609280346qtquick3d-Windows-Windows_11_24H2-Mingw-Windows-Windows_11_24H2-X86_64.7z"
            "shadertools.7z" = "qt.qt6.6120.addons.qtshadertools.win64_mingw/6.12.0-0-202609280346qtshadertools-Windows-Windows_11_24H2-Mingw-Windows-Windows_11_24H2-X86_64.7z"
          }
          New-Item -ItemType Directory -Force -Path C:/Qt/6.12.0/mingw_64 | Out-Null
          foreach ($k in $items.Keys) {
            $got = $false
            foreach ($b in $bases) {
              curl.exe -fsSL -o "C:/$k" "$b/$($items[$k])"
              if ($LASTEXITCODE -eq 0) { Write-Host "$k <- $b"; $got = $true; break }
              Write-Host "mirror miss for $k (exit $LASTEXITCODE): $b"
            }
            if (-not $got) { throw "all mirrors failed for $k" }
            7z x -y -oC:/Qt/6.12.0/mingw_64 "C:/$k" | Out-Null
          }
          if (-not (Test-Path "C:/Qt/6.12.0/mingw_64/bin/qmake.exe")) { throw "qmake.exe missing for Qt 6.12.0" }
          if (-not (Test-Path "C:/Qt/6.12.0/mingw_64/bin/Qt6SerialPort.dll")) { throw "Qt6SerialPort.dll missing for 6.12.0" }
          # Quick 3D 的两条硬前置(v1.9.3):装不上就**直接红**,不能静默继续 ——
          # 否则 Quick3D 冒烟会"绿着 SKIP"(v1.9.2 那 3 个 SKIP 就是这么来的)。
          if (-not (Test-Path "C:/Qt/6.12.0/mingw_64/bin/Qt6ShaderTools.dll")) { throw "Qt6ShaderTools.dll missing for Qt 6.12.0 (qtshadertools addon 没解进去)" }
          if (-not (Test-Path "C:/Qt/6.12.0/mingw_64/qml/QtQuick3D/qquick3dplugin.dll")) { throw "qml/QtQuick3D/qquick3dplugin.dll missing for Qt 6.12.0 (qtquick3d addon 没解进去)" }
          Copy-Item lib/jqt.dll lib/jqt-windows-6.8.3.dll -Force

      - name: Build jqt.dll (Qt 6.12.0)
        shell: pwsh
        run: |
          $gpp = Get-ChildItem "C:/Qt/Tools" -Recurse -Depth 3 -Filter "g++.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $mingw = if ($gpp) { Split-Path (Split-Path $gpp.FullName) } else { "C:/Qt/Tools/mingw1310_64" }
          powershell -File build.ps1 -JDK "$env:JAVA_HOME" -QtRoot "C:/Qt/6.12.0" -Mingw $mingw *> build612_log.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "=== BUILD 6.12.0 FAILED ==="; Get-Content build612_log.txt -Tail 60; exit $LASTEXITCODE }
          Copy-Item lib/jqt.dll lib/jqt-windows-6.12.0.dll -Force

      - name: Smoke test Qt 6.12.0 (offscreen, headless)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"      # QtQuick 场景图需要软件后端(离屏无 GPU)
          $env:QT_PLUGIN_PATH = "C:/Qt/6.12.0/mingw_64/plugins"
          foreach ($cls in @("org.jqt.SmokeL1","org.jqt.SmokeL2b1","org.jqt.SmokeL2b2","org.jqt.SmokeGenApi","org.jqt.SmokeSignalOnce","org.jqt.SmokeTimer","org.jqt.SmokeConcurrency","org.jqt.SmokeCallbackError","org.jqt.SmokeStacked","org.jqt.SmokeEvent","org.jqt.SmokeNetwork","org.jqt.SmokeSqlModel","org.jqt.SmokeWebSocket","org.jqt.SmokeJQtTest","org.jqt.SmokeStateMachine","org.jqt.SmokeDBus","org.jqt.SmokeWebView","org.jqt.SmokeQuick3D","org.jqt.SmokeCharts","org.jqt.SmokeMultimedia","org.jqt.SmokeModality","org.jqt.SmokeQml","org.jqt.SmokePositioning","org.jqt.SmokeHelp","org.jqt.SmokeFluent","org.jqt.SmokeInputDialog","org.jqt.SmokeVisible","org.jqt.SmokeSqlDb","org.jqt.SmokeL2","org.jqt.SmokeL1fin")) {
            powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class $cls -AutoClose 1000 *> "smoke612_$cls.log"
            if ($LASTEXITCODE -ne 0) { Write-Host "=== SMOKE $cls FAILED on Qt 6.12.0 ==="; Get-Content "smoke612_$cls.log" -Tail 40; exit $LASTEXITCODE }
          }

      - name: Quick 3D real-window smoke, strict (v1.9.3)
        shell: pwsh
        run: |
          # 为什么必须单独一步:Quick 3D 要有 RHI + 能建 swapchain,而 offscreen 平台插件
          # 没有任何 GL/RHI 表面 —— Qt Quick 会退到软件后端(日志 "Loading backend software"),
          # View3D 什么都不画,上面那步 offscreen 里 Quick3D 的内容检查只能 SKIP(实测结论)。
          # 这一步用**真窗口**(windows 平台插件;无独显时 D3D11 走 WARP 软件光栅)把
          # 立方体/清屏色/尺寸三个像素断言真跑一遍。
          # JQT_Q3D_STRICT=1:任何 SKIP 都算 FAIL —— 把"环境退化 -> 跳过 -> 绿"这条路堵死。
          # 每个 step 环境独立:这里**故意不设** QT_QPA_PLATFORM / QT_QUICK_BACKEND。
          $env:JQT_Q3D_STRICT = "1"
          $env:QT_PLUGIN_PATH = "C:/Qt/6.12.0/mingw_64/plugins"
          $env:JQT_Q3D_PNG = "$PWD/smoke612_quick3d_window.png"
          # CI runner 的 CPU 比开发机慢:冒烟默认在 show 后 700ms 抓图,而首帧(含 Quick3D 的
          # 着色器/管线创建)可能晚于它 -> 抓到一帧"没有 3D"的画面 -> SKIP -> 严格模式下假阴性红。
          # 这里给 3 倍窗口(2100 / 3150 / 4200ms)。**没有放宽任何断言**:STRICT、skip=0、
          # 立方体像素三条全在,只是"多等一会儿再判"。
          $env:JQT_Q3D_WAIT_MS = "2100"
          # -AutoClose 只是兜底(实测 jqt.autoClose 只被 JQtDemo/JQtFluentDemo/JQtQfDemo 消费,
          # 冒烟自己 scheduleQuit);写大一点,免得将来冒烟开始认它时把这 2100ms 的抓图切掉。
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeQuick3D -AutoClose 6000 *> smoke612_quick3d_window.log
          $code = $LASTEXITCODE
          Get-Content smoke612_quick3d_window.log
          if ($code -ne 0) { Write-Host "=== QUICK3D REAL-WINDOW SMOKE FAILED (exit $code) ==="; exit $code }
          # 正向证据(两段式断言的反向一半由 JQT_Q3D_STRICT=1 承担):日志里必须真有
          # "skip=0" 的结论行与立方体像素断言 —— 否则文件为空/冒烟没跑完也会"通过"。
          if (-not (Select-String -Path smoke612_quick3d_window.log -Pattern "\[q3d\] pass=\d+ fail=0 skip=0" -Quiet)) {
            Write-Host "::error::Quick3D 真窗口冒烟没有 skip=0 的通过结论(环境退化成了 SKIP?)"
            exit 1
          }
          if (-not (Select-String -Path smoke612_quick3d_window.log -Pattern "\[q3d\] OK +立方体材质色 #f59e0b 像素 > 0" -Quiet)) {
            Write-Host "::error::Quick3D 真窗口冒烟里没有立方体像素断言通过的证据"
            exit 1
          }
          Select-String -Path smoke612_quick3d_window.log -Pattern "渲染环境|图像尺寸|立方体类暖色|清屏类深蓝|pass=" | ForEach-Object { $_.Line }
          Write-Host "Quick3D 真窗口渲染验证通过(像素证据见上)"

      - name: Upload Quick3D real-window evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-quick3d-logs
          # 这一步是"CI 上才失败"时唯一的现场:日志里有环境/GL/像素统计,PNG 是实际画面
          path: |
            smoke612_quick3d_window.log
            smoke612_quick3d_window.png
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jqt-windows-x64
          path: lib/

  windows-arm64:
    name: Windows ARM64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      # Temurin windows-aarch64 尚无 JDK 26，用 23（源码为 Java 17 语法，兼容）
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '23'

      - name: Install Qt 6.8.3 win64_arm64 (manual 7z - aqt cannot parse this XML)
        shell: pwsh
        run: |
          $url = "https://download.qt.io/online/qtsdkrepository/windows_arm64/desktop/qt6_683/qt6_683/qt.qt6.683.win64_msvc2022_arm64/6.8.3-0-202503201308qtbase-Windows-Windows_11_22H2-MSVC2022-Windows-Windows_11_22H2-AARCH64.7z"
          Write-Host "Downloading: $url"
          curl.exe -fsSL -o C:/qtbase.7z $url
          New-Item -ItemType Directory -Force -Path C:/Qt | Out-Null
          7z x -y -oC:/Qt C:/qtbase.7z | Out-Null
          $qmake = Get-ChildItem C:/Qt -Recurse -Filter qmake.exe | Select-Object -First 1
          if (-not $qmake) {
            Write-Host "=== C:/Qt tree (depth 3) ==="
            Get-ChildItem C:/Qt -Recurse -Depth 3 | Select-Object -First 30 -ExpandProperty FullName
            throw "qmake.exe not found after extraction"
          }
          $qtRoot = Split-Path (Split-Path $qmake.FullName)
          Write-Host "QTBASE=$qtRoot"
          "QTBASE=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          # v0.7.4: qtserialport 模块（解压后定位并复制到 QTBASE）
          curl.exe -fsSL -o C:/qtserialport.7z "https://download.qt.io/online/qtsdkrepository/windows_arm64/desktop/qt6_683/qt6_683/qt.qt6.683.addons.qtserialport.win64_msvc2022_arm64/6.8.3-0-202503201308qtserialport-Windows-Windows_11_22H2-MSVC2022-Windows-Windows_11_22H2-AARCH64.7z"
          7z x -y -oC:/Qt C:/qtserialport.7z | Out-Null
          $sp = Get-ChildItem C:/Qt -Recurse -Filter qserialport.h | Select-Object -First 1
          if (-not $sp) { throw "qserialport.h not found after extraction" }
          $spDir = $sp.Directory
          while ($spDir -and $spDir.Name -ne "QtSerialPort" -and $spDir.Parent) { $spDir = $spDir.Parent }
          if (-not $spDir) { throw "QtSerialPort dir not found" }
          if (-not (Test-Path "$qtRoot\include\QtSerialPort")) { Copy-Item $spDir.FullName "$qtRoot\include\\" -Recurse -Force }
          $splib = Get-ChildItem C:/Qt -Recurse -Filter "Qt6SerialPort.lib" | Select-Object -First 1
          if ($splib) { Copy-Item $splib.FullName "$qtRoot\lib\\" -Force -ErrorAction SilentlyContinue }
          Write-Host "qtserialport copied to QTBASE"

      - name: Build jqt.dll (MSVC ARM64, Qt 6.8.3)
        shell: pwsh
        run: |
          powershell -File build-arm64.ps1 -JDK "$env:JAVA_HOME" -QtRoot "$env:QTBASE" *> build_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== BUILD FAILED, tail of build_log.txt ==="
            Get-Content build_log.txt -Tail 60
            exit $LASTEXITCODE
          }
          Copy-Item lib/jqt.dll lib/jqt-windows-arm64-6.8.3.dll -Force

      - name: Smoke test (offscreen, headless) - Qt 6.8.3
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_PLUGIN_PATH = "$env:QTBASE/plugins"
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -AutoClose 2000 *> smoke_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE FAILED, tail of smoke_log.txt ==="
            Get-Content smoke_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          # 状态机（纯 Java，无模块依赖；此前 ARM64 作业漏跑 -> 已补）
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeStateMachine -AutoClose 1000 *> smoke_statemachine_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE STATEMACHINE FAILED, tail of smoke_statemachine_log.txt ==="
            Get-Content smoke_statemachine_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          # DBus（ARM64 上 Qt6DBus.lib 可能不在包里 -> 探测不到时 API 报 unavailable,冒烟会走 SKIP 分支）
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeDBus -AutoClose 1000 *> smoke_dbus_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE DBUS FAILED, tail of smoke_dbus_log.txt ==="
            Get-Content smoke_dbus_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          # JQtTest 兼容层（纯 Java，同样此前漏跑）
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeJQtTest -AutoClose 1000 *> smoke_jqttest_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE JQTTEST FAILED, tail of smoke_jqttest_log.txt ==="
            Get-Content smoke_jqttest_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          # Exclusive Kit 跨平台 API 冒烟（v0.7.0）
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeExclusive -AutoClose 1000 *> smoke_exclusive_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE EXCLUSIVE FAILED, tail of smoke_exclusive_log.txt ==="
            Get-Content smoke_exclusive_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          # L1 收尾冒烟（v0.7.1）
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeL1 -AutoClose 1000 *> smoke_l1_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE L1 FAILED, tail of smoke_l1_log.txt ==="
            Get-Content smoke_l1_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeL1b2 -AutoClose 1000 *> smoke_l1b2_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE L1B2 FAILED, tail of smoke_l1b2_log.txt ==="
            Get-Content smoke_l1b2_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          # 工业模块冒烟（v0.7.2：PDF + SQLite）
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeV072 -AutoClose 1000 *> smoke_v072_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE V072 FAILED, tail of smoke_v072_log.txt ==="
            Get-Content smoke_v072_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          # QOpenGLWidget 冒烟（v0.7.3，offscreen 容错）
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeV073 -AutoClose 1000 *> smoke_v073_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE V073 FAILED, tail of smoke_v073_log.txt ==="
            Get-Content smoke_v073_log.txt -Tail 40
            exit $LASTEXITCODE
          }
          # QSerialPort 冒烟（v0.7.4）
          powershell -File run.ps1 -JDK "$env:JAVA_HOME" -Class org.jqt.SmokeV074 -AutoClose 1000 *> smoke_v074_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE V074 FAILED, tail of smoke_v074_log.txt ==="
            Get-Content smoke_v074_log.txt -Tail 40
            exit $LASTEXITCODE
          }

      - name: Install Qt 6.12.0 win64_arm64 (manual 7z)
        shell: pwsh
        run: |
          $url = "https://download.qt.io/online/qtsdkrepository/windows_arm64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.win64_msvc2022_arm64/6.12.0-0-202609280346qtbase-Windows-Windows_11_23H2-MSVC2022-Windows-Windows_11_23H2-AARCH64.7z"
          Write-Host "Downloading: $url"
          curl.exe -fsSL -o C:/qtbase6120.7z $url
          New-Item -ItemType Directory -Force -Path C:/Qt6120 | Out-Null
          7z x -y -oC:/Qt6120 C:/qtbase6120.7z | Out-Null
          $qmake = Get-ChildItem C:/Qt6120 -Recurse -Filter qmake.exe | Select-Object -First 1
          if (-not $qmake) { throw "qmake.exe not found for Qt 6.12.0 arm64" }
          $qtRoot = Split-Path (Split-Path $qmake.FullName)
          Write-Host "QTBASE6120=$qtRoot"
          "QTBASE6120=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          # v0.7.4: qtserialport 模块（解压后定位并复制到 QTBASE）
          curl.exe -fsSL -o C:/qtserialport6120.7z "https://download.qt.io/online/qtsdkrepository/windows_arm64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.addons.qtserialport.win64_msvc2022_arm64/6.12.0-0-202609280346qtserialport-Windows-Windows_11_23H2-MSVC2022-Windows-Windows_11_23H2-AARCH64.7z"
          curl.exe -fsSL -o C:/qtwebsockets6120.7z "https://download.qt.io/online/qtsdkrepository/windows_arm64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.addons.qtwebsockets.win64_msvc2022_arm64/6.12.0-0-202609280346qtwebsockets-Windows-Windows_11_23H2-MSVC2022-Windows-Windows_11_23H2-AARCH64.7z"
          curl.exe -fsSL -o C:/qtcharts6120.7z "https://download.qt.io/online/qtsdkrepository/windows_arm64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.addons.qtcharts.win64_msvc2022_arm64/6.12.0-0-202609280346qtcharts-Windows-Windows_11_23H2-MSVC2022-Windows-Windows_11_23H2-AARCH64.7z"
          curl.exe -fsSL -o C:/qtmultimedia6120.7z "https://download.qt.io/online/qtsdkrepository/windows_arm64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.addons.qtmultimedia.win64_msvc2022_arm64/6.12.0-0-202609280346qtmultimedia-Windows-Windows_11_23H2-MSVC2022-Windows-Windows_11_23H2-AARCH64.7z"
          curl.exe -fsSL -o C:/qtdeclarative6120.7z "https://download.qt.io/online/qtsdkrepository/windows_arm64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.win64_msvc2022_arm64/6.12.0-0-202609280346qtdeclarative-Windows-Windows_11_23H2-MSVC2022-Windows-Windows_11_23H2-AARCH64.7z"
          curl.exe -fsSL -o C:/qtpositioning6120.7z "https://download.qt.io/online/qtsdkrepository/windows_arm64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.addons.qtpositioning.win64_msvc2022_arm64/6.12.0-0-202609280346qtpositioning-Windows-Windows_11_23H2-MSVC2022-Windows-Windows_11_23H2-AARCH64.7z"
          7z x -y -oC:/Qt6120 C:/qtpositioning6120.7z | Out-Null
          7z x -y -oC:/Qt6120 C:/qtdeclarative6120.7z | Out-Null
          7z x -y -oC:/Qt6120 C:/qtmultimedia6120.7z | Out-Null
          7z x -y -oC:/Qt6120 C:/qtcharts6120.7z | Out-Null
          7z x -y -oC:/Qt6120 C:/qtwebsockets6120.7z | Out-Null
          7z x -y -oC:/Qt6120 C:/qtserialport6120.7z | Out-Null
          $sp = Get-ChildItem C:/Qt6120 -Recurse -Filter qserialport.h | Select-Object -First 1
          if (-not $sp) { throw "qserialport.h not found for 6.12.0" }
          $spDir = $sp.Directory
          while ($spDir -and $spDir.Name -ne "QtSerialPort" -and $spDir.Parent) { $spDir = $spDir.Parent }
          if (-not $spDir) { throw "QtSerialPort dir not found for 6.12.0" }
          if (-not (Test-Path "$env:QTBASE6120\include\QtSerialPort")) { Copy-Item $spDir.FullName "$env:QTBASE6120\include\\" -Recurse -Force }
          $splib = Get-ChildItem C:/Qt6120 -Recurse -Filter "Qt6SerialPort.lib" | Select-Object -First 1
          if ($splib) { Copy-Item $splib.FullName "$env:QTBASE6120\lib\\" -Force -ErrorAction SilentlyContinue }
          Write-Host "qtserialport 6.12.0 copied"

      - name: Build jqt.dll (MSVC ARM64, Qt 6.12.0)
        shell: pwsh
        run: |
          powershell -File build-arm64.ps1 -JDK "$env:JAVA_HOME" -QtRoot "$env:QTBASE6120" *> build6120_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== BUILD FAILED (6.12.0), tail of build6120_log.txt ==="
            Get-Content build6120_log.txt -Tail 60
            exit $LASTEXITCODE
          }
          Copy-Item lib/jqt.dll lib/jqt-windows-arm64-6.12.0.dll -Force
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-build-logs
          path: |
            build_log.txt
            smoke_log.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jqt-windows-arm64
          path: lib/

  # ================= macOS (install-qt-action) =================
  macos:
    name: macOS x64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Install Qt 6.12.0 for macOS (manual 7z - aqt cannot parse new repo XML)
        run: |
          brew install p7zip > /dev/null 2>&1 || true
          base="https://download.qt.io/online/qtsdkrepository/mac_x64/desktop/qt6_6120/qt6_6120"
          curl -fsSL -o /tmp/qtbase6120.7z "$base/qt.qt6.6120.clang_64/6.12.0-0-202609280346qtbase-MacOS-MacOS_26-Clang-MacOS-MacOS_26-X86_64-ARM64.7z"
          curl -fsSL -o /tmp/qtserialport6120.7z "$base/qt.qt6.6120.addons.qtserialport.clang_64/6.12.0-0-202609280346qtserialport-MacOS-MacOS_26-Clang-MacOS-MacOS_26-X86_64-ARM64.7z"
          curl -fsSL -o /tmp/qtwebsockets6120.7z "$base/qt.qt6.6120.addons.qtwebsockets.clang_64/6.12.0-0-202609280346qtwebsockets-MacOS-MacOS_26-Clang-MacOS-MacOS_26-X86_64-ARM64.7z"
          curl -fsSL -o /tmp/qtcharts6120.7z "$base/qt.qt6.6120.addons.qtcharts.clang_64/6.12.0-0-202609280346qtcharts-MacOS-MacOS_26-Clang-MacOS-MacOS_26-X86_64-ARM64.7z"
          curl -fsSL -o /tmp/qtmultimedia6120.7z "$base/qt.qt6.6120.addons.qtmultimedia.clang_64/6.12.0-0-202609280346qtmultimedia-MacOS-MacOS_26-Clang-MacOS-MacOS_26-X86_64-ARM64.7z"
          curl -fsSL -o /tmp/qtdeclarative6120.7z "$base/qt.qt6.6120.clang_64/6.12.0-0-202609280346qtdeclarative-MacOS-MacOS_26-Clang-MacOS-MacOS_26-X86_64-ARM64.7z"
          curl -fsSL -o /tmp/qtpositioning6120.7z "$base/qt.qt6.6120.addons.qtpositioning.clang_64/6.12.0-0-202609280346qtpositioning-MacOS-MacOS_26-Clang-MacOS-MacOS_26-X86_64-ARM64.7z"
          # QtSvg 是 base 包(qt.qt6.6120.clang_64/)里**独立的一个 7z**,不是 qtbase 的一部分。
          # 只解 qtbase -> 永远没有 lib/QtSvg.framework -> QSvgRenderer 在 macOS 上一直 SKIP。
          # (7z 清单实测:qtsvg 那个 7z 里是 QtSvg.framework/Versions/A/QtSvg +
          #  Versions/A/Headers/QSvgRenderer + Headers -> Versions/Current/Headers 符号链接。)
          curl -fsSL -o /tmp/qtsvg6120.7z "$base/qt.qt6.6120.clang_64/6.12.0-0-202609280346qtsvg-MacOS-MacOS_26-Clang-MacOS-MacOS_26-X86_64-ARM64.7z"
          # Qt Quick 3D + Qt Shader Tools(v1.9.3):与 Windows/Linux 同一套理由 ——
          # qtquick3d 提供 QtQuick3D*.framework 与 qml/QtQuick3D,而插件链最后一环
          # libQt6ShaderTools 在**另一个 addon**(qtshadertools)里,缺它插件加载必失败。
          curl -fsSL -o /tmp/qtquick3d6120.7z "$base/qt.qt6.6120.addons.qtquick3d.clang_64/6.12.0-0-202609280346qtquick3d-MacOS-MacOS_26-Clang-MacOS-MacOS_26-X86_64-ARM64.7z"
          curl -fsSL -o /tmp/qtshadertools6120.7z "$base/qt.qt6.6120.addons.qtshadertools.clang_64/6.12.0-0-202609280346qtshadertools-MacOS-MacOS_26-Clang-MacOS-MacOS_26-X86_64-ARM64.7z"
          mkdir -p "$HOME/Qt6120"
          7z x -y -o"$HOME/Qt6120" /tmp/qtbase6120.7z > /dev/null
          7z x -y -o"$HOME/Qt6120" /tmp/qtserialport6120.7z > /dev/null
          7z x -y -o"$HOME/Qt6120" /tmp/qtwebsockets6120.7z > /dev/null
          7z x -y -o"$HOME/Qt6120" /tmp/qtcharts6120.7z > /dev/null
          7z x -y -o"$HOME/Qt6120" /tmp/qtmultimedia6120.7z > /dev/null
          7z x -y -o"$HOME/Qt6120" /tmp/qtdeclarative6120.7z > /dev/null
          7z x -y -o"$HOME/Qt6120" /tmp/qtpositioning6120.7z > /dev/null
          7z x -y -o"$HOME/Qt6120" /tmp/qtsvg6120.7z > /dev/null
          7z x -y -o"$HOME/Qt6120" /tmp/qtquick3d6120.7z > /dev/null
          7z x -y -o"$HOME/Qt6120" /tmp/qtshadertools6120.7z > /dev/null
          rm -f /tmp/qtbase6120.7z /tmp/qtserialport6120.7z /tmp/qtsvg6120.7z /tmp/qtquick3d6120.7z /tmp/qtshadertools6120.7z
          test -f "$HOME/Qt6120/lib/QtWidgets.framework/Headers/QWidget" || (echo "QtWidgets.framework missing"; find "$HOME/Qt6120" -maxdepth 3 -type d | head -20; exit 1)
          # 就地断言:QtSvg.framework 的头必须真的在(-f 会跟随 Headers 符号链接)
          test -f "$HOME/Qt6120/lib/QtSvg.framework/Headers/QSvgRenderer" || (echo "QtSvg.framework missing (qtsvg 7z 没装进去?)"; ls -la "$HOME/Qt6120/lib" | grep -i svg; exit 1)
          # Quick 3D 的两条硬前置(v1.9.3):装不上就红,别让 Quick3D 在 macOS 上"绿着 SKIP"
          test -f "$HOME/Qt6120/qml/QtQuick3D/qmldir" || (echo "qml/QtQuick3D/qmldir missing (qtquick3d 7z 没装进去?)"; find "$HOME/Qt6120/qml" -maxdepth 2 -type d 2>/dev/null | head -20; exit 1)
          ls "$HOME/Qt6120/lib" | grep -qi shadertools || (echo "QtShaderTools.framework missing (qtshadertools 7z 没装进去?)"; ls "$HOME/Qt6120/lib" | head -30; exit 1)

      - name: Install aqt (for Qt 6.8.3)
        run: |
          python3 -m venv /tmp/aqt-venv
          /tmp/aqt-venv/bin/pip install aqtinstall
          printf '[mirrors]\ntrusted_mirrors = https://download.qt.io\n' > /tmp/aqt.ini

      - name: Install Qt 6.8.3 for macOS (clang_64)
        run: |
          /tmp/aqt-venv/bin/python -m aqt -c /tmp/aqt.ini install-qt mac desktop 6.8.3 clang_64 --outputdir $HOME/Qt683 -m qtserialport
          test -f "$HOME/Qt683/6.8.3/macos/lib/QtWidgets.framework/Headers/QWidget" || exit 1
          # aqt 默认会把 qt.qt6.683.clang_64 整包(含 qtsvg)装上 —— 这里把这件事变成硬依赖:
          # 哪天 aqt 默认档位变了,这一步会先红,而不是让 QSvgRenderer 在 6.8.3 上悄悄回到 SKIP。
          test -f "$HOME/Qt683/6.8.3/macos/lib/QtSvg.framework/Headers/QSvgRenderer" || { echo "aqt 没装上 qtsvg"; exit 1; }

      - name: Build libjqt.dylib (Qt 6.8.3)
        run: |
          chmod +x build-macos.sh
          QT_BASE="$HOME/Qt683/6.8.3/macos" ./build-macos.sh
          mv lib/libjqt.dylib lib/libjqt-6.8.3.dylib

      - name: Build libjqt.dylib (Qt 6.12.0)
        run: |
          QT_BASE="$HOME/Qt6120" ./build-macos.sh
          mv lib/libjqt.dylib lib/libjqt-6.12.0.dylib

      - name: Smoke test (offscreen, headless)
        run: |
          chmod +x run-macos.sh
          cp lib/libjqt-6.12.0.dylib lib/libjqt.dylib
          export QT_BASE="$HOME/Qt6120"
          QT_QPA_PLATFORM=offscreen ./run-macos.sh -AutoClose 2000
          # Exclusive Kit 跨平台 API 冒烟（v0.7.0）
          QT_QPA_PLATFORM=offscreen ./run-macos.sh -Class org.jqt.SmokeExclusive -AutoClose 1000
          # L1 收尾冒烟（v0.7.1）
          QT_QPA_PLATFORM=offscreen ./run-macos.sh -Class org.jqt.SmokeL1 -AutoClose 1000
          QT_QPA_PLATFORM=offscreen ./run-macos.sh -Class org.jqt.SmokeL1b2 -AutoClose 1000
          # 工业模块冒烟（v0.7.2：PDF + SQLite）
          QT_QPA_PLATFORM=offscreen ./run-macos.sh -Class org.jqt.SmokeV072 -AutoClose 1000
          # QOpenGLWidget 冒烟（v0.7.3，offscreen 容错）
          QT_QPA_PLATFORM=offscreen ./run-macos.sh -Class org.jqt.SmokeV073 -AutoClose 1000
          # QSerialPort 冒烟（v0.7.4）
          QT_QPA_PLATFORM=offscreen ./run-macos.sh -Class org.jqt.SmokeV074 -AutoClose 1000
      - name: Smoke test signal determinism (Qt 6.12.0)
        run: |
          export QT_BASE="$HOME/Qt6120"
          QT_QPA_PLATFORM=offscreen ./run-macos.sh -Class org.jqt.SmokeSignalOnce -AutoClose 800
          QT_QPA_PLATFORM=offscreen ./run-macos.sh -Class org.jqt.SmokeL2b2 -AutoClose 800
          QT_QPA_PLATFORM=offscreen ./run-macos.sh -Class org.jqt.SmokeTimer -AutoClose 1500
          export QT_QUICK_BACKEND=software       # QtQuick 场景图软件后端(离屏无 GPU)
          # macOS 的冒烟是 ./run-macos.sh -Class ... 直接输出到日志(不落文件),而下面的硬断言
          # 要 grep,所以用 tee 同时落一份文件。set -o pipefail 保证 run-macos.sh 的失败
          # 不会被 tee 的 0 退出码吞掉(不然等于把冒烟的失败检查关掉)。
          set -o pipefail
          for C in org.jqt.SmokeConcurrency org.jqt.SmokeCallbackError org.jqt.SmokeStacked org.jqt.SmokeEvent org.jqt.SmokeNetwork org.jqt.SmokeSqlModel org.jqt.SmokeWebSocket org.jqt.SmokeJQtTest org.jqt.SmokeStateMachine org.jqt.SmokeDBus org.jqt.SmokeWebView org.jqt.SmokeCharts org.jqt.SmokeMultimedia org.jqt.SmokeModality org.jqt.SmokeQml org.jqt.SmokeFluent org.jqt.SmokeInputDialog org.jqt.SmokeVisible org.jqt.SmokeL2 org.jqt.SmokeL1fin; do
            QT_QPA_PLATFORM=offscreen ./run-macos.sh -Class $C -AutoClose 1500 2>&1 | tee "smoke_macos_$C.txt"

          done
          # 硬断言(v1.9.2):QSvg 与 SQLite 在 macOS 上不许再 SKIP —— 以后退化直接红。
          # 与 Linux 共用同一份两段式断言脚本(反向禁 SKIP + 正向要求看到实测断言行)。
          bash tools/smoke-assert-no-skip.sh macOS \
               "smoke_macos_org.jqt.SmokeEvent.txt" "smoke_macos_org.jqt.SmokeSqlModel.txt"

      - name: Real-window smoke (macOS, best effort)
        run: |
          # 真窗口(cocoa,不加 offscreen):这是唯一能直接命中 J1 类问题的路径。
          # GitHub macOS runner 不一定有 GUI 会话,故按"尽力而为"处理:
          # 失败只告警不失败作业 —— 硬防线在 Linux 的 xvfb-run + xcb 那一步。
          export QT_BASE="$HOME/Qt6120"
          if ./run-macos.sh -Class org.jqt.SmokeRealWindow -AutoClose 1200; then
            echo "macOS 真窗口冒烟通过"
          else
            echo "::warning::macOS 真窗口冒烟未通过(CI 可能无 GUI 会话);J1/J2 仍由静态守卫覆盖"
          fi

      - name: Guard -XstartOnFirstThread / absolute java in run-macos.sh (J1/J2 regression)
        run: |
          # macOS 真窗口必须在主线程:缺 -XstartOnFirstThread 会 NSWindow 崩溃(J1)
          grep -q -- '-XstartOnFirstThread' run-macos.sh || { echo "run-macos.sh 缺少 -XstartOnFirstThread"; exit 1; }
          # java 必须绝对路径,否则 SIP 会剥掉 DYLD_*(J2)
          grep -q 'JAVA_HOME' run-macos.sh || { echo "run-macos.sh 未使用绝对 java 路径"; exit 1; }

      - name: Bundle Qt runtime (macOS) + validate bundled launcher
        run: |
          chmod +x tools/bundle-qt.sh
          QT_BASE="$HOME/Qt6120" ./tools/bundle-qt.sh
          # 解包 -> 放入我们的 classes -> 用包内启动器跑一次离屏冒烟(证明自带 Qt 真能用)
          TMP="$(mktemp -d)"
          tar -xzf dist/*-qt-runtime.tar.gz -C "$TMP"
          PKG="$(ls -d "$TMP"/*/ | head -1)"
          cp -R out "$PKG/"
          ( cd "$PKG" && QT_QPA_PLATFORM=offscreen ./run-with-bundled-qt.sh org.jqt.SmokeL1 )
          ( cd "$PKG" && QT_QPA_PLATFORM=offscreen ./run-with-bundled-qt.sh org.jqt.SmokeSignalOnce )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjqt-macos-x64
          path: lib/libjqt-*.dylib

      - name: Upload Qt runtime bundle (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: jqt-macos-qt-runtime
          path: dist/*-qt-runtime.tar.gz

  # ================= Release package (jar + 3 platform libs + docs) =================
  release-package:
    name: Release package
    needs: [ linux, windows, windows-arm64, macos ]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'

      - name: Build jqt.jar (platform-independent)
        run: |
          find java -name "*.java" | sed 's/.*/"&"/' > /tmp/jqt_srcs.txt
          mkdir -p out dist
          javac -encoding UTF-8 -d out @/tmp/jqt_srcs.txt
          VERSION=$(cat VERSION)
          jar --create --file "dist/jqt-$VERSION.jar" -C out .

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release package
        run: |
          VERSION=$(cat VERSION)
          mkdir -p dist/native
          cp artifacts/libjqt-linux-x64/libjqt-6.12.0.so dist/native/libjqt-linux-6.12.0.so
          cp artifacts/libjqt-linux-x64/libjqt-6.8.3.so dist/native/libjqt-linux-6.8.3.so
          cp artifacts/jqt-windows-x64/jqt-windows-6.8.3.dll dist/native/jqt-windows-6.8.3.dll
          cp artifacts/jqt-windows-x64/jqt-windows-6.12.0.dll dist/native/jqt-windows-6.12.0.dll
          cp artifacts/jqt-windows-arm64/jqt-windows-arm64-6.8.3.dll dist/native/jqt-windows-arm64-6.8.3.dll
          cp artifacts/jqt-windows-arm64/jqt-windows-arm64-6.12.0.dll dist/native/jqt-windows-arm64-6.12.0.dll
          cp artifacts/libjqt-macos-x64/libjqt-6.12.0.dylib dist/native/libjqt-macos-6.12.0.dylib
          cp artifacts/libjqt-macos-x64/libjqt-6.8.3.dylib dist/native/libjqt-macos-6.8.3.dylib
          cp README.md LICENSE.md LICENSE LGPL-3.0.txt THIRD-PARTY-NOTICES.md CHANGELOG.md VERSION dist/
          cp docs/getting-started.md dist/
          ls -la dist dist/native

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: jqt-release
          path: dist/