name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # ================= Linux (Ubuntu + apt Qt6) =================
  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Install Qt6 + g++
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev g++

      - name: Build libjqt.so
        run: chmod +x build-linux.sh && ./build-linux.sh

      - name: Smoke test (offscreen, headless)
        timeout-minutes: 4
        run: |
          chmod +x run-linux.sh
          java -version 2>&1
          set +e
          QT_QPA_PLATFORM=offscreen timeout 90 ./run-linux.sh -AutoClose 2000 > smoke_out.txt 2>&1
          CODE=$?
          echo "smoke exit code: $CODE"
          cat smoke_out.txt
          if [ $CODE -ne 0 ]; then
            echo "=== DIAG ==="
            ls -la "$PWD/lib"
            ldd "$PWD/lib/libjqt.so" 2>&1 | head -20
            find /usr/lib -name "*qoffscreen*" 2>/dev/null
            # 若超时挂起，抓 Java 线程栈
            JPID=$(pgrep -f "org.jqt.JQtDemo" | head -1)
            if [ -n "$JPID" ]; then
              echo "=== jstack of $JPID ==="
              jcmd "$JPID" Thread.print 2>&1 | head -80
              kill -9 "$JPID"
            fi
            exit $CODE
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjqt-linux-x64
          path: lib/libjqt.so

  # ================= Windows (aqtinstall Qt + MinGW) =================
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Install Qt 6.11.2 + MinGW 13.1 via aqtinstall
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop 6.11.2 win64_mingw --outputdir D:/Qt --archives qtbase
          python -m aqt install-tool windows desktop tools_mingw1310 --outputdir D:/Qt

      - name: Locate Qt kit and MinGW
        shell: pwsh
        run: |
          # aqt 的实际输出位置可能因版本而异：全盘定位 qmake.exe
          $kit = Get-ChildItem "C:/Qt", "D:/Qt" -Recurse -Depth 5 -Filter "qmake.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $kit) {
            Write-Host "qmake.exe NOT FOUND - dumping C:/Qt and D:/Qt:"
            Get-ChildItem "C:/Qt", "D:/Qt" -Recurse -Depth 3 -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "qmake.exe not found after aqtinstall"
          }
          $qtRoot = Split-Path (Split-Path $kit.FullName)
          Write-Host "QTROOT=$qtRoot (qmake: $($kit.FullName))"
          "QTROOT=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          $gpp = Get-ChildItem "C:/Qt/Tools", "D:/Qt/Tools" -Recurse -Depth 4 -Filter "g++.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($gpp) {
            $mingw = Split-Path (Split-Path $gpp.FullName)
            Write-Host "MINGW=$mingw"
            "MINGW=$mingw" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          } else {
            Write-Host "g++.exe not found under C:/Qt/Tools or D:/Qt/Tools"
          }

      - name: Build jqt.dll
        shell: pwsh
        run: |
          powershell -File build.ps1 -JDK "$env:JAVA_HOME" -QtRoot "$env:QTROOT" -Mingw "$env:MINGW" *> build_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== BUILD FAILED, tail of build_log.txt ==="
            Get-Content build_log.txt -Tail 60
            exit $LASTEXITCODE
          }

      - name: Smoke test (offscreen, headless)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_PLUGIN_PATH = "$env:QTROOT/mingw_64/plugins"
          powershell -File run.ps1 -AutoClose 2000 *> smoke_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE FAILED, tail of smoke_log.txt ==="
            Get-Content smoke_log.txt -Tail 40
            exit $LASTEXITCODE
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            build_log.txt
            smoke_log.txt
            inspect_log.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jqt-windows-x64
          path: lib/

  # ================= macOS (aqtinstall Qt) =================
  macos:
    name: macOS x64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Install Qt 6.11.2 for macOS via aqtinstall
        run: |
          python3 -m venv /tmp/aqt-venv
          /tmp/aqt-venv/bin/pip install aqtinstall
          /tmp/aqt-venv/bin/python -m aqt install-qt mac desktop 6.11.2 macos --outputdir $HOME/Qt --archives qtbase

      - name: Locate Qt for macOS
        run: |
          QTBASE=$(find "$HOME/Qt" -maxdepth 4 -type d -name "macos" | head -1)
          if [ -z "$QTBASE" ]; then find "$HOME/Qt" -maxdepth 3 -type d | head -20; exit 1; fi
          echo "QTBASE=$QTBASE"
          echo "QTBASE=$QTBASE" >> $GITHUB_ENV

      - name: Build libjqt.dylib
        run: |
          chmod +x build-macos.sh
          QT_BASE="$QTBASE" ./build-macos.sh

      - name: Smoke test (offscreen, headless)
        run: |
          chmod +x run-macos.sh
          QT_BASE="$QTBASE"
          QT_QPA_PLATFORM=offscreen ./run-macos.sh -AutoClose 2000

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjqt-macos-x64
          path: lib/libjqt.dylib
