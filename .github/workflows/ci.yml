name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # ================= Linux (Ubuntu + apt Qt6) =================
  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Qt6 + g++
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev g++

      - name: Build libjqt.so
        run: chmod +x build-linux.sh && ./build-linux.sh

      - name: Smoke test (offscreen, headless)
        run: |
          chmod +x run-linux.sh
          set +e
          QT_QPA_PLATFORM=offscreen ./run-linux.sh -AutoClose 2000
          CODE=$?
          if [ $CODE -ne 0 ]; then
            echo "=== DIAG ==="
            java -version 2>&1
            ls -la "$PWD/lib"
            ldd "$PWD/lib/libjqt.so" 2>&1 | head -20
            find /usr/lib -name "*qoffscreen*" 2>/dev/null
            exit $CODE
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjqt-linux-x64
          path: lib/libjqt.so

  # ================= Windows (aqtinstall Qt + MinGW) =================
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Qt 6.11.2 + MinGW 13.1 via aqtinstall
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop 6.11.2 win64_mingw -O D:/Qt --archives qtbase
          python -m aqt install-tool windows desktop tools_mingw1310 -O D:/Qt

      - name: Inspect installed toolchain (diagnostic)
        shell: pwsh
        continue-on-error: true
        run: |
          "=== Qt layout ===" | Out-File inspect_log.txt
          Get-ChildItem "D:/Qt" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Out-File -Append inspect_log.txt
          Get-ChildItem "D:/Qt/6.11.2" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Out-File -Append inspect_log.txt
          Get-ChildItem "D:/Qt/Tools" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Out-File -Append inspect_log.txt
          "=== g++.exe search ===" | Out-File -Append inspect_log.txt
          Get-ChildItem "D:/Qt" -Recurse -Depth 5 -Filter "g++.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName | Out-File -Append inspect_log.txt
          Get-Content inspect_log.txt

      - name: Build jqt.dll
        shell: pwsh
        run: |
          # 自动探测 MinGW 真实位置（容错 aqt 布局差异）
          $mingw = "D:/Qt/Tools/mingw1310_64"
          if (-not (Test-Path "$mingw/bin/g++.exe")) {
            $found = Get-ChildItem "D:/Qt" -Recurse -Depth 5 -Filter "g++.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $mingw = Split-Path (Split-Path $found.FullName) }
            Write-Host "MinGW not at default path, adjusted to: $mingw"
          }
          powershell -File build.ps1 -JDK "$env:JAVA_HOME" -QtRoot "D:/Qt/6.11.2" -Mingw $mingw *> build_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== BUILD FAILED, tail of build_log.txt ==="
            Get-Content build_log.txt -Tail 60
            exit $LASTEXITCODE
          }

      - name: Smoke test (offscreen, headless)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_PLUGIN_PATH = "D:/Qt/6.11.2/mingw_64/plugins"
          powershell -File run.ps1 -AutoClose 2000 *> smoke_log.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== SMOKE FAILED, tail of smoke_log.txt ==="
            Get-Content smoke_log.txt -Tail 40
            exit $LASTEXITCODE
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: |
            build_log.txt
            smoke_log.txt
            inspect_log.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jqt-windows-x64
          path: lib/

  # ================= macOS (aqtinstall Qt) =================
  macos:
    name: macOS x64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Qt 6.11.2 for macOS via aqtinstall
        run: |
          pip3 install aqtinstall
          python3 -m aqt install-qt mac desktop 6.11.2 macos -O $HOME/Qt --archives qtbase

      - name: Build libjqt.dylib
        run: |
          chmod +x build-macos.sh
          QT_BASE=$HOME/Qt/6.11.2/macos ./build-macos.sh

      - name: Smoke test (offscreen, headless)
        run: |
          chmod +x run-macos.sh
          QT_BASE=$HOME/Qt/6.11.2/macos
          QT_QPA_PLATFORM=offscreen ./run-macos.sh -AutoClose 2000

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjqt-macos-x64
          path: lib/libjqt.dylib
